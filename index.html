<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ardmx Configuration Interface</title>

    <style>
        #sacn:checked ~ .optional_tab#sacn_options,
        #artnet:checked ~ .optional_tab#artnet_options
        {
            display: block;
        }

        .tab{
            width: fit-content;
            background-color: gray;
            padding: 10px;
            margin: 10px;
        }

        .optional_tab{
            display: none;
        }

        .title{
            margin: 0px;
            text-align: center;
            font-weight: bold;
        }

        .led{
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: red;
            border-radius: 50%;
        }

        
        .input_element{
            display: grid;
            grid-template-columns: 50% 50%;
        }

        .input_element input{
            field-sizing: content;
        }

        .submitbtn{
            width: 100%;
        }

        .submitbtn + .led{
            margin-left: 30%;
        }

        .submitbtn + .led + p{
            display: inline;
        }

        #sacn{margin-left: 12.5%;}
        #sacn + label{margin-right: 10%;}
        #artnet{margin-left: 10%;}
        #artnet + label{margin-right: 12.5%;}
    </style>
</head>
<body>
    <div id="node" class="tab">
        <p class="title">Node</p>
        <div class="input_element">
            <div>
                <div class="led" id="node.rx"></div>
                <label for="node.rx">RX</label>
            </div>

            <div>
                <div class="led" id="node.tx"></div>
                <label for="node.tx">TX</label>
            </div>
        </div>


        <div class="input_element">
            <label for="interface">Interface</label>
            <select name="interface" id="interface">
                <optgroup id="node.options">
                    <option value="0">Example 1 (172.16.5.45)</option>
                    <option value="1">Example 2 (192.168.1.36)</option>
                    <option value="2">Example 3 (169.254.189.56)</option>
                </optgroup>
                <option value="refresh" id="node.refresh">Refresh</option>
            </select>
        </div>

        <input type="radio" name="protocol" id="sacn">
        <label for="sacn">sACN</label>

        <input type="radio" name="protocol" id="artnet" checked>
        <label for="artnet">Art-Net</label>
        
        <div id="sacn_options" class="optional_tab">
            <div class="input_element">
                <label for="universe">Universe</label>
                <input type="number" name="universe" id="universe" value="1" min="1" max="63999">
            </div>
        </div>

        <div id="artnet_options" class="optional_tab">
            <div class="input_element">
                <label for="net">Net</label>
                <input type="number" name="net" id="net" value="0" min="0" max="127">
            </div>

            <div class="input_element">
                <label for="subnet">Subnet</label>
                <input type="number" name="subnet" id="subnet" value="0" min="0" max="15">
            </div>

            <div class="input_element">
                <label for="universe">Universe</label>
                <input type="number" name="universe" id="universe" value="0" min="0" max="15">
            </div>
        </div>

        <button class="submitbtn">Connect</button>
        <div class="led" id="node.status.led"></div>
        <p id="node.status.text">Not Connected</p>
    </div>

    <div id="device" class="tab">
        <p class="title">Device</p>
        <div class="input_element">
            <div>
                <div class="led" id="device.rx"></div>
                <label for="device.rx">RX</label>
            </div>

            <div>
                <div class="led" id="device.tx"></div>
                <label for="device.tx">TX</label>
            </div>
        </div>

        <div class="input_element">
            <label for="interface">Interface</label>
            <select name="interface" id="interface">
                <optgroup id="device.options">
                    <option value="0">Unknown Device (COM3)</option>
                    <option value="1">Arduino (COM4)</option>
                </optgroup>
                <option value="refresh" id="device.refresh">Refresh</option>
            </select>
        </div>

        <button class="submitbtn">Connect</button>
        <div class="led" id="device.status.led"></div>
        <p id="device.status.text">Not Connected</p>
    </div>

    <script>
        const wsUri = "ws://127.0.0.1:1234/";
        const websocket = new WebSocket(wsUri);

        websocket.addEventListener("open", () => {
            console.log("CONNECTED");
        });

        websocket.addEventListener("message", (e) => {
            const update = JSON.parse(e.data);
            
            switch (update.type) {
                case "LED_Update":
                    document.getElementById("node.status.text").textContent = update.data["node.status.text"];
                    document.getElementById("node.status.led").style.backgroundColor = update.data["node.status.led"];
                    document.getElementById("node.rx").style.backgroundColor = update.data["node.rx"];
                    document.getElementById("node.tx").style.backgroundColor = update.data["node.tx"];

                    document.getElementById("device.status.text").textContent = update.data["device.status.text"];
                    document.getElementById("device.status.led").style.backgroundColor = update.data["device.status.led"];
                    document.getElementById("device.rx").style.backgroundColor = update.data["device.rx"];
                    document.getElementById("device.tx").style.backgroundColor = update.data["device.tx"];
                    break;
            
                default:
                    console.error("Websocket Exchange Type: '" + update.type + "'', not recognized");
                    break;
            }
        });

        websocket.addEventListener("error", (e) => {
            console.log(e);
            console.error("An Error Occured with the WebSocket");
        });
    </script>
</body>
</html>
